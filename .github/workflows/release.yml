name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: npm ci

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          # 优先用 PAT（带 repo 权限，不受仓库 workflow permissions 限制）；
          # 没配 PAT 时回退到默认 GITHUB_TOKEN。
          GITHUB_TOKEN: ${{ secrets.PAT || secrets.GITHUB_TOKEN }}
        with:
          # 打 tag 时自动创建 Release 并上传 NSIS 安装包；
          # 手动触发（workflow_dispatch）时只构建、不发布。
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: "BXT ${{ github.ref_name }}"
          releaseBody: |
            ### Install

            Download `BXT_*_x64-setup.exe` below and double-click — **no administrator rights needed**.
            It installs per-user into `%LOCALAPPDATA%\BXT` and does not trigger UAC.

            If setup reports `Error writing temporary file`, a security suite blocked extraction
            (the installer is unsigned). Right-click the file → **Run as administrator**.

            ### What changed

            [CHANGELOG (English)](https://github.com/XUSTOR/bxt/blob/main/CHANGELOG.md) ·
            [更新日志（中文）](https://github.com/XUSTOR/bxt/blob/main/CHANGELOG.zh-CN.md)

            ### Why it never presses Enter

            BXT hands the AI exact terminal context and then stops. When the answer contains a
            command it types it at your prompt — bracketed paste, no trailing newline, no
            auto-submit — and waits. You read it, you edit it, you press Enter.
            Context can be automated; accountability can't.
          releaseDraft: true
          prerelease: false
          args: --bundles nsis

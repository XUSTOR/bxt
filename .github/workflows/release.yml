name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: npm ci

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          # 优先用 PAT（带 repo 权限，不受仓库 workflow permissions 限制）；
          # 没配 PAT 时回退到默认 GITHUB_TOKEN。
          GITHUB_TOKEN: ${{ secrets.PAT || secrets.GITHUB_TOKEN }}
        with:
          # 打 tag 时自动创建 Release 并上传 NSIS 安装包；
          # 手动触发（workflow_dispatch）时只构建、不发布。
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: "BXT ${{ github.ref_name }}"
          releaseBody: "See CHANGELOG."
          releaseDraft: true
          prerelease: false
          args: --bundles nsis

[package]
name = "app"
version = "0.1.2"
description = "BXT — Better Xterminal"
authors = ["xustor"]
license = "MIT"
repository = "https://github.com/XUSTOR/bxt"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
base64 = "0.23"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-log = "2"
# 单实例：避免第二个进程抢同一个 WebView2 profile（会直接崩溃）
tauri-plugin-single-instance = "2"
encoding_rs = "0.8.42"
portable-pty = "0.9.0"
arboard = "3"
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "native-tls",
    "http2",
    "system-proxy",
] }

# API Key 的本地加密只用 Windows 的 DPAPI；
# MessageBoxW 用于启动失败时弹窗（release 无控制台，否则用户只看到闪退）
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_UI_WindowsAndMessaging",
] }
# 关掉 WebView2 自带的浏览器快捷键（F5/Ctrl+R/Ctrl+F…），这些键要留给终端。
# 版本必须和 wry 依赖的一致，否则 COM 接口类型对不上。
webview2-com = "0.39"
windows-core = "0.62"

# 发布构建：体积优先。10.8 MB → 约 7 MB，冷启动从磁盘读取更少。
# 代价是编译变慢（LTO + codegen-units=1），只在 release 生效。
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"
